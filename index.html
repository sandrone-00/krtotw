<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>桑多龍語言學習網｜讓學習變得輕鬆又快樂</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fcfaf6;
            color: #756b64;
            font-family: "Zen Maru Gothic", "Nunito", sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           整體背景
        ========================= */

        .page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 小圓點裝飾 */

        .dot {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ded2c8;
            opacity: 0.6;
        }

        .dot1 {
            top: 16%;
            left: 8%;
        }

        .dot2 {
            top: 28%;
            right: 10%;
        }

        .dot3 {
            top: 65%;
            left: 5%;
        }

        .dot4 {
            top: 75%;
            right: 8%;
        }

        /* =========================
           上方標題
        ========================= */

        header {
            text-align: center;
            padding: 70px 20px 25px;
            position: relative;
            z-index: 5;
        }

        .small-title {
            font-size: 15px;
            letter-spacing: 3px;
            color: #b2a39a;
            margin-bottom: 13px;
        }

        h1 {
            font-size: clamp(34px, 6vw, 58px);
            color: #6e625b;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .subtitle {
            font-size: clamp(15px, 2vw, 19px);
            color: #9a8d84;
            letter-spacing: 2px;
        }

        /* =========================
           小村莊
        ========================= */

        .village {
            width: min(1100px, 94%);
            height: 300px;
            margin: 15px auto 0;
            position: relative;
        }

        /* 天空雲朵 */

        .cloud {
            position: absolute;
            width: 95px;
            height: 42px;
            border: 3px solid #d8cbc1;
            border-radius: 50px;
            background: #fffdf9;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            border: 3px solid #d8cbc1;
            background: #fffdf9;
            border-radius: 50%;
        }

        .cloud::before {
            width: 43px;
            height: 43px;
            left: 15px;
            top: -25px;
        }

        .cloud::after {
            width: 35px;
            height: 35px;
            right: 13px;
            top: -18px;
        }

        .cloud1 {
            left: 8%;
            top: 55px;
            transform: scale(.8);
        }

        .cloud2 {
            right: 8%;
            top: 35px;
            transform: scale(.65);
        }

        /* 山丘 */

        .hill-back {
            position: absolute;
            bottom: 20px;
            left: -5%;
            width: 110%;
            height: 150px;
            background: #eee7df;
            border-radius: 50% 50% 0 0;
        }

        .hill-front {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 105px;
            background: #e3ddd3;
            border-radius: 50% 50% 0 0;
        }

        /* =========================
           房屋
        ========================= */

        .house {
            position: absolute;
            bottom: 45px;
            z-index: 3;
        }

        .house-body {
            width: 110px;
            height: 85px;
            background: #fffaf3;
            border: 3px solid #a9988d;
            border-radius: 8px;
            position: relative;
        }

        .roof {
            width: 0;
            height: 0;
            border-left: 68px solid transparent;
            border-right: 68px solid transparent;
            border-bottom: 58px solid #c8b5a8;
            position: absolute;
            top: -55px;
            left: -13px;
        }

        .roof::after {
            content: "";
            position: absolute;
            width: 115px;
            height: 8px;
            background: #a9988d;
            left: -57px;
            top: 49px;
            transform: rotate(-1deg);
            border-radius: 10px;
        }

        .door {
            position: absolute;
            bottom: 0;
            left: 41px;
            width: 30px;
            height: 47px;
            background: #d9c6b8;
            border: 3px solid #a9988d;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
        }

        .window {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #dce8e8;
            border: 3px solid #a9988d;
            border-radius: 5px;
            top: 20px;
        }

        .window.left {
            left: 12px;
        }

        .window.right {
            right: 12px;
        }

        .house1 {
            left: 17%;
        }

        .house1 .house-body {
            transform: scale(.75);
        }

        .house2 {
            left: 43%;
            bottom: 50px;
        }

        .house2 .house-body {
            transform: scale(1);
        }

        .house3 {
            right: 16%;
        }

        .house3 .house-body {
            transform: scale(.72);
        }

        /* =========================
           樹木
        ========================= */

        .tree {
            position: absolute;
            bottom: 50px;
            z-index: 4;
        }

        .tree-top {
            width: 65px;
            height: 65px;
            background: #d8d1c5;
            border: 3px solid #a99b91;
            border-radius: 50%;
            position: relative;
        }

        .tree-top::before,
        .tree-top::after {
            content: "";
            position: absolute;
            background: #d8d1c5;
            border: 3px solid #a99b91;
            border-radius: 50%;
        }

        .tree-top::before {
            width: 42px;
            height: 42px;
            left: -18px;
            top: 18px;
        }

        .tree-top::after {
            width: 45px;
            height: 45px;
            right: -16px;
            top: 12px;
        }

        .tree-trunk {
            width: 13px;
            height: 45px;
            background: #b8a69a;
            border: 2px solid #9f8d81;
            margin: -2px auto 0;
            border-radius: 0 0 5px 5px;
        }

        .tree1 {
            left: 8%;
        }

        .tree2 {
            right: 8%;
            transform: scale(.8);
        }

        /* =========================
           小角色
        ========================= */

        .character {
            position: absolute;
            bottom: 47px;
            z-index: 5;
            width: 60px;
            height: 75px;
        }

        .character-body {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 42px;
            height: 48px;
            background: #fffdf9;
            border: 3px solid #a99b91;
            border-radius: 45% 45% 40% 40%;
        }

        .ear {
            position: absolute;
            width: 18px;
            height: 25px;
            background: #fffdf9;
            border: 3px solid #a99b91;
            border-radius: 50%;
            top: 0;
        }

        .ear.left {
            left: 3px;
            transform: rotate(-25deg);
        }

        .ear.right {
            right: 3px;
            transform: rotate(25deg);
        }

        .eye {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #897c73;
            border-radius: 50%;
            top: 22px;
        }

        .eye.left {
            left: 19px;
        }

        .eye.right {
            right: 19px;
        }

        .character.c1 {
            left: 29%;
            transform: scale(.75);
        }

        .character.c2 {
            right: 28%;
            transform: scale(.65);
        }

        /* =========================
           學習區域
        ========================= */

        .learning {
            position: relative;
            z-index: 10;
            width: min(1000px, 92%);
            margin: -10px auto 70px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            font-size: 27px;
            color: #75685f;
            margin-bottom: 9px;
        }

        .section-title p {
            color: #a09389;
            font-size: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .card {
            background: rgba(255, 253, 249, 0.95);
            border: 2px solid #ddd2c8;
            border-radius: 28px;
            padding: 32px 30px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all .25s ease;
            box-shadow: 0 8px 25px rgba(130, 110, 95, .06);
        }

        .card:hover {
            transform: translateY(-7px) rotate(-.5deg);
            box-shadow: 0 15px 35px rgba(130, 110, 95, .12);
            border-color: #cdbdb1;
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 23px;
            color: #70635b;
            margin-bottom: 9px;
        }

        .card p {
            font-size: 14px;
            line-height: 1.9;
            color: #9a8e86;
        }

        .card .arrow {
            position: absolute;
            right: 28px;
            bottom: 24px;
            font-size: 20px;
            color: #b9a79b;
        }

        /* 韓文學習村 */

        .korean-card {
            background: #fffdf8;
        }

        .korean-card::before {
            content: "안녕!";
            position: absolute;
            right: 25px;
            top: 22px;
            font-size: 14px;
            color: #b5a9a0;
            transform: rotate(8deg);
        }

        /* 建造中 */

        .building-card {
            background: #faf8f4;
            opacity: .9;
        }

        .building-card .card-icon {
            filter: grayscale(.2);
        }

        .building-card::after {
            content: "coming soon";
            position: absolute;
            right: 25px;
            top: 25px;
            font-size: 12px;
            color: #b8aaa0;
            letter-spacing: 1px;
        }

        /* =========================
           Footer
        ========================= */

        footer {
            text-align: center;
            padding: 35px 20px 45px;
            color: #b1a49b;
            font-size: 13px;
            letter-spacing: 1px;
        }

        footer .heart {
            color: #c7aeb0;
        }

        /* =========================
           手繪裝飾
        ========================= */

        .sparkle {
            position: absolute;
            color: #c5b2a5;
            font-size: 20px;
            z-index: 2;
        }

        .sparkle.s1 {
            left: 20%;
            top: 25%;
        }

        .sparkle.s2 {
            right: 20%;
            top: 18%;
        }

        .sparkle.s3 {
            left: 13%;
            bottom: 20%;
        }

        /* =========================
           RWD
        ========================= */

        @media (max-width: 700px) {

            header {
                padding-top: 50px;
            }

            h1 {
                letter-spacing: 1px;
            }

            .village {
                height: 245px;
            }

            .house1 {
                left: 7%;
            }

            .house3 {
                right: 5%;
            }

            .tree1 {
                left: 1%;
            }

            .tree2 {
                right: 1%;
            }

            .character.c1 {
                left: 30%;
            }

            .character.c2 {
                right: 27%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 28px 25px;
            }

            .section-title h2 {
                font-size: 24px;
            }
        }

    </style>
</head>


<body>

<div class="page">

    <!-- 背景裝飾 -->
    <span class="dot dot1"></span>
    <span class="dot dot2"></span>
    <span class="dot dot3"></span>
    <span class="dot dot4"></span>

    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✧</span>
    <span class="sparkle s3">✦</span>


    <!-- =========================
         標題
    ========================= -->

    <header>

        <div class="small-title">
            SANDORONG LANGUAGE WORLD
        </div>

        <h1>
            桑多龍語言學習網
        </h1>

        <div class="subtitle">
            讓學習變得輕鬆又快樂
        </div>

    </header>


    <!-- =========================
         小村莊插畫
    ========================= -->

    <section class="village">

        <!-- 雲 -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <!-- 遠山 -->
        <div class="hill-back"></div>

        <!-- 房屋 -->
        <div class="house house1">
            <div class="roof"></div>
            <div class="house-body">
                <div class="window left"></div>
                <div class="window right"></div>
                <div class="door"></div>
            </div>
        </div>

        <div class="house house2">
            <div class="roof"></div>
            <div class="house-body">
                <div class="window left"></div>
                <div class="window right"></div>
                <div class="door"></div>
            </div>
        </div>

        <div class="house house3">
            <div class="roof"></div>
            <div class="house-body">
                <div class="window left"></div>
                <div class="window right"></div>
                <div class="door"></div>
            </div>
        </div>


        <!-- 樹 -->
        <div class="tree tree1">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>

        <div class="tree tree2">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
        </div>


        <!-- 小角色 -->
        <div class="character c1">
            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="character-body">
                <span class="eye left"></span>
                <span class="eye right"></span>
            </div>
        </div>

        <div class="character c2">
            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="character-body">
                <span class="eye left"></span>
                <span class="eye right"></span>
            </div>
        </div>


        <!-- 前景 -->
        <div class="hill-front"></div>

    </section>


    <!-- =========================
         語言學習國
    ========================= -->

    <main class="learning">

        <div class="section-title">

            <h2>
                🌿 語言學習國
            </h2>

            <p>
                24小時陪伴學習，將基礎穩定打好
            </p>

        </div>


        <div class="cards">

            <!-- 韓文學習村 -->

            <a
                href="korean/index.html"
                class="card korean-card"
            >

                <div class="card-icon">
                    🏠
                </div>

                <h3>
                    韓文學習村
                </h3>

                <p>
                    從韓文發音開始，慢慢建立單字、
                    情境表達與文法基礎，
                    一步一步打造自己的韓文能力。
                </p>

                <span class="arrow">
                    →
                </span>

            </a>


            <!-- 建造中 -->

            <div class="card building-card">

                <div class="card-icon">
                    🛠️
                </div>

                <h3>
                    建造中
                </h3>

                <p>
                    新的語言學習區域正在慢慢建造中，
                    敬請期待下一座學習村落。
                </p>

                <span class="arrow">
                    ✦
                </span>

            </div>

        </div>

    </main>


    <!-- =========================
         Footer
    ========================= -->

    <footer>

        <p>
            桑多龍語言學習網
            <span class="heart">♡</span>
            讓學習變得輕鬆又快樂
        </p>

    </footer>

</div>


</body>
</html>
