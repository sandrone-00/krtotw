<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>基本子音｜Chocochip Korean</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;

            background: #f7f5f2;

            color: #333;

            line-height: 1.6;
        }


        /* =====================
           導覽列
        ===================== */

        header {

            height: 70px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 50px;

            border-bottom: 1px solid #eee;
        }


        .logo {

            font-size: 20px;

            font-weight: bold;
        }


        .back {

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }


        .back:hover {

            color: #000;
        }


        /* =====================
           主要內容
        ===================== */

        .container {

            max-width: 1000px;

            margin: 50px auto;

            padding: 0 20px;
        }


        /* =====================
           標題
        ===================== */

        .title {

            text-align: center;

            margin-bottom: 45px;
        }


        .title h1 {

            font-size: 36px;

            margin-bottom: 15px;
        }


        .title p {

            color: #777;

            line-height: 1.9;
        }


        /* =====================
           40音介紹
        ===================== */

        .intro {

            background: white;

            border-radius: 20px;

            padding: 35px;

            margin-bottom: 35px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.04);
        }


        .intro h2 {

            margin-bottom: 18px;

            font-size: 24px;
        }


        .intro p {

            color: #666;

            line-height: 2;
        }


        .number {

            display: inline-block;

            background: #333;

            color: white;

            padding: 3px 10px;

            border-radius: 20px;

            font-size: 12px;

            margin-right: 8px;
        }


        /* =====================
           分類標題
        ===================== */

        .section-title {

            font-size: 25px;

            margin: 45px 0 20px;
        }


        /* =====================
           子音卡片
        ===================== */

        .alphabet-grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;
        }


        .alphabet-card {

            background: white;

            border-radius: 15px;

            padding: 25px 15px;

            text-align: center;

            transition: 0.2s;

            border: 2px solid transparent;
        }


        .alphabet-card:hover {

            transform: translateY(-3px);

            border-color: #ddd;
        }


        .letter {

            font-size: 42px;

            margin-bottom: 10px;

            font-weight: bold;
        }


        .name {

            font-size: 14px;

            color: #666;

            margin-bottom: 12px;
        }


        .romanization {

            font-size: 13px;

            color: #999;

            margin-bottom: 15px;
        }


        .sound-button {

            border: none;

            background: #f1f1f1;

            border-radius: 20px;

            padding: 7px 15px;

            cursor: pointer;

            font-size: 14px;
        }


        .sound-button:hover {

            background: #e5e5e5;
        }


        /* =====================
           下一階段
        ===================== */

        .next-section {

            background: white;

            border-radius: 20px;

            padding: 40px;

            margin-top: 45px;

            margin-bottom: 60px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.04);
        }


        .next-section h2 {

            font-size: 28px;

            margin-bottom: 15px;
        }


        .next-section p {

            color: #777;

            margin-bottom: 25px;
        }


        .password-box {

            display: flex;

            justify-content: center;

            gap: 10px;
        }


        .password-box input {

            width: 240px;

            padding: 12px 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }


        .password-box button {

            border: none;

            background: #333;

            color: white;

            padding: 12px 25px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }


        .password-box button:hover {

            background: #555;
        }


        #passwordMessage {

            margin-top: 15px;

            font-size: 14px;

            color: #c55;
        }


        /* =====================
           Footer
        ===================== */

        footer {

            background: white;

            text-align: center;

            padding: 30px;

            color: #999;

            font-size: 13px;
        }


        /* =====================
           手機版
        ===================== */

        @media (max-width: 700px) {

            header {

                padding: 0 20px;
            }


            .title h1 {

                font-size: 30px;
            }


            .alphabet-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }


            .password-box {

                flex-direction: column;

                align-items: center;
            }


            .password-box input {

                width: 100%;

                max-width: 300px;
            }

        }

    </style>

</head>


<body>


    <!-- 導覽列 -->

    <header>

        <div class="logo">
            🇰🇷 Chocochip Korean
        </div>


        <a
            href="course.html"
            class="back"
        >
            ← 返回課程
        </a>

    </header>



    <main class="container">


        <!-- 標題 -->

        <section class="title">

            <h1>
                韓文40音發音入門
            </h1>

            <p>
                從韓文的基本字母開始，
                認識子音與母音，
                建立正確的韓文發音基礎。
            </p>

        </section>



        <!-- 40音介紹 -->

        <section class="intro">

            <h2>

                <span class="number">
                    01
                </span>

                認識韓文40音

            </h2>


            <p>

                學習韓文的第一步，
                就是先熟悉這些基本字母的形狀與發音。

                <br>

                韓文40音包含
                19個基本子音
                與
                21個基本母音。

                <br>

                這一階段我們先從
                <strong>19個基本子音</strong>
                開始。

            </p>

        </section>



        <!-- 19個基本子音 -->

        <h2 class="section-title">

            19個基本子音

        </h2>


        <div
            class="alphabet-grid"
            id="consonants"
        >

        </div>



        <!-- 下一階段 -->

        <section class="next-section">

            <h2>
                下一階段
            </h2>


            <p>

                完成基本子音學習後，
                輸入老師提供的密碼，
                解鎖21個基本母音。

            </p>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="請輸入密碼"
                    onkeydown="checkEnter(event)"
                >


                <button
                    onclick="unlockVowels()"
                >
                    解鎖
                </button>

            </div>


            <p id="passwordMessage"></p>

        </section>


    </main>



    <footer>

        © 2026 Chocochip Korean

    </footer>



    <script>


        /* ============================
           19個基本子音
        ============================ */


        const consonants = [

            ["ㄱ", "기역", "g / k"],

            ["ㄴ", "니은", "n"],

            ["ㄷ", "디귿", "d / t"],

            ["ㄹ", "리을", "r / l"],

            ["ㅁ", "미음", "m"],

            ["ㅂ", "비읍", "b / p"],

            ["ㅅ", "시옷", "s"],

            ["ㅇ", "이응", "ng"],

            ["ㅈ", "지읒", "j"],

            ["ㅊ", "치읓", "ch"],

            ["ㅋ", "키읔", "k"],

            ["ㅌ", "티읕", "t"],

            ["ㅍ", "피읖", "p"],

            ["ㅎ", "히읗", "h"],

            ["ㄲ", "쌍기역", "kk"],

            ["ㄸ", "쌍디귿", "tt"],

            ["ㅃ", "쌍비읍", "pp"],

            ["ㅆ", "쌍시옷", "ss"],

            ["ㅉ", "쌍지읒", "jj"]

        ];



        /* ============================
           建立子音卡片
        ============================ */


        function createCards(data) {

            const container =
                document.getElementById("consonants");


            data.forEach(item => {


                const card =
                    document.createElement("div");


                card.className =
                    "alphabet-card";


                card.innerHTML = `

                    <div class="letter">
                        ${item[0]}
                    </div>


                    <div class="name">
                        ${item[1]}
                    </div>


                    <div class="romanization">
                        ${item[2]}
                    </div>


                    <button
                        class="sound-button"
                        onclick="playSound('${item[0]}')"
                    >
                        🔊 發音
                    </button>

                `;


                container.appendChild(card);

            });

        }



        /* ============================
           播放韓文發音
        ============================ */


        function playSound(letter) {


            const speech =
                new SpeechSynthesisUtterance(letter);


            speech.lang = "ko-KR";


            speech.rate = 0.7;


            speech.pitch = 1;


            speechSynthesis.cancel();


            speechSynthesis.speak(speech);

        }



        /* ============================
           解鎖基本母音
        ============================ */


        function unlockVowels() {


            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("passwordMessage");


            if (password === "choco40") {


                window.location.href =
                    "vowels.html";


            } else {


                message.textContent =
                    "密碼錯誤，請向老師確認密碼。";

            }

        }



        /* ============================
           Enter 也可以解鎖
        ============================ */


        function checkEnter(event) {

            if (event.key === "Enter") {

                unlockVowels();

            }

        }



        /* ============================
           啟動
        ============================ */


        createCards(consonants);


    </script>


</body>

</html>
