<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>基本子音｜桑多龍學習平台</title>


<style>

/* =====================
   基本設定
===================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #f8f6f2;

    color: #333;

    line-height: 1.6;

    overflow-x: hidden;

}


/* =====================
   背景裝飾
===================== */

.background-decoration {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;

}


/* 圓形 */

.circle {

    position: absolute;

    border-radius: 50%;

    border: 2px solid #ddd3ca;

    opacity: 0.65;

}

.circle-1 {

    width: 80px;

    height: 80px;

    top: 18%;

    left: 3%;

}

.circle-2 {

    width: 38px;

    height: 38px;

    top: 35%;

    right: 7%;

    border-color: #d8cedd;

}

.circle-3 {

    width: 100px;

    height: 100px;

    bottom: 13%;

    right: 2%;

    border-color: #d8d1c8;

}


/* 星星 */

.star {

    position: absolute;

    color: #c4b4a9;

    font-size: 22px;

    opacity: .75;

}

.star-1 {

    top: 13%;

    left: 13%;

}

.star-2 {

    top: 22%;

    right: 15%;

}

.star-3 {

    bottom: 20%;

    left: 8%;

}


/* 小愛心 */

.heart {

    position: absolute;

    color: #cbb5ba;

    font-size: 25px;

    opacity: .65;

}

.heart-1 {

    top: 50%;

    right: 9%;

}

.heart-2 {

    bottom: 10%;

    left: 17%;

}


/* =====================
   小兔子
===================== */

.bunny {

    position: absolute;

    width: 80px;

    height: 85px;

    opacity: .65;

}


/* 身體 */

.bunny-body {

    position: absolute;

    width: 50px;

    height: 45px;

    left: 15px;

    bottom: 5px;

    background: #fffdf9;

    border: 3px solid #c8bbb2;

    border-radius: 50%;

}


/* 耳朵 */

.bunny-ear {

    position: absolute;

    width: 19px;

    height: 38px;

    background: #fffdf9;

    border: 3px solid #c8bbb2;

    border-radius: 50%;

    top: 4px;

}

.bunny-ear.left {

    left: 18px;

    transform: rotate(-10deg);

}

.bunny-ear.right {

    right: 18px;

    transform: rotate(10deg);

}


/* 眼睛 */

.bunny-eye {

    position: absolute;

    width: 4px;

    height: 4px;

    background: #8f827a;

    border-radius: 50%;

    top: 19px;

}

.bunny-eye.left {

    left: 15px;

}

.bunny-eye.right {

    right: 15px;

}


/* 小兔子位置 */

.bunny-1 {

    left: 2%;

    bottom: 7%;

    transform: scale(.85) rotate(-5deg);

}

.bunny-2 {

    right: 2%;

    top: 12%;

    transform: scale(.65) rotate(5deg);

}


/* =====================
   導覽列
===================== */

header {

    position: relative;

    z-index: 5;

    height: 70px;

    background: rgba(255,255,255,.94);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 50px;

    border-bottom: 1px solid #eee;

}


.logo {

    font-size: 20px;

    font-weight: bold;

    color: #6d625b;

}


.back {

    color: #756b64;

    text-decoration: none;

    font-size: 14px;

    padding: 8px 18px;

    border: 1px solid #ddd4cd;

    border-radius: 20px;

    transition: .2s;

}


.back:hover {

    background: #f2eee9;

    transform: translateY(-2px);

}


/* =====================
   主要內容
===================== */

.container {

    position: relative;

    z-index: 2;

    max-width: 1000px;

    margin: 50px auto;

    padding: 0 20px;

}


/* =====================
   標題
===================== */

.title {

    text-align: center;

    margin-bottom: 45px;

}


.title h1 {

    font-size: 36px;

    margin-bottom: 15px;

    color: #665c55;

}


.title p {

    color: #777;

    line-height: 1.9;

}


/* =====================
   40音介紹
===================== */

.intro {

    background: rgba(255,255,255,.94);

    border-radius: 20px;

    padding: 35px;

    margin-bottom: 35px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.04);

    border: 1px solid #eee7e0;

}


.intro h2 {

    margin-bottom: 18px;

    font-size: 24px;

    color: #70655e;

}


.intro p {

    color: #666;

    line-height: 2;

}


.number {

    display: inline-block;

    background: #cbbdb2;

    color: white;

    padding: 3px 10px;

    border-radius: 20px;

    font-size: 12px;

    margin-right: 8px;

}


/* =====================
   分類標題
===================== */

.section-title {

    font-size: 25px;

    margin: 45px 0 20px;

    color: #6f645d;

}


/* =====================
   子音卡片
===================== */

.alphabet-grid {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 15px;

}


/* 卡片 */

.alphabet-card {

    background: rgba(255,255,255,.95);

    border-radius: 15px;

    padding: 25px 15px;

    text-align: center;

    transition: 0.2s;

    border: 2px solid transparent;

    box-shadow:
        0 4px 15px rgba(100,85,70,.04);

}


.alphabet-card:hover {

    transform: translateY(-5px);

    border-color: #d8ccc2;

    box-shadow:
        0 8px 20px rgba(100,85,70,.08);

}


/* 韓文字 */

.letter {

    font-size: 42px;

    margin-bottom: 10px;

    font-weight: bold;

    color: #625850;

}


/* 名稱 */

.name {

    font-size: 14px;

    color: #666;

    margin-bottom: 12px;

}


/* 羅馬拼音 */

.romanization {

    font-size: 13px;

    color: #999;

    margin-bottom: 15px;

}


/* 發音按鈕 */

.sound-button {

    border: none;

    background: #f1eee9;

    color: #71665e;

    border-radius: 20px;

    padding: 7px 15px;

    cursor: pointer;

    font-size: 14px;

    transition: .2s;

}


.sound-button:hover {

    background: #e5ded6;

    transform: scale(1.03);

}


/* =====================
   Footer
===================== */

footer {

    position: relative;

    z-index: 2;

    background: rgba(255,255,255,.9);

    text-align: center;

    padding: 30px;

    color: #999;

    font-size: 13px;

    border-top: 1px solid #eee7e0;

}


/* =====================
   手機版
===================== */

@media (max-width: 700px) {

    header {

        padding: 0 20px;

    }


    .logo {

        font-size: 17px;

    }


    .title h1 {

        font-size: 30px;

    }


    .alphabet-grid {

        grid-template-columns:
            repeat(3, 1fr);

    }


    .bunny {

        opacity: .35;

    }

}


@media (max-width: 450px) {

    .alphabet-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .intro {

        padding: 25px 20px;

    }

}

</style>

</head>


<body>


<!-- =====================
     背景裝飾
===================== -->

<div class="background-decoration">

    <div class="circle circle-1"></div>

    <div class="circle circle-2"></div>

    <div class="circle circle-3"></div>


    <div class="star star-1">✦</div>

    <div class="star star-2">✧</div>

    <div class="star star-3">✦</div>


    <div class="heart heart-1">♡</div>

    <div class="heart heart-2">♡</div>


    <!-- 小兔子 -->

    <div class="bunny bunny-1">

        <div class="bunny-ear left"></div>

        <div class="bunny-ear right"></div>

        <div class="bunny-body">

            <span class="bunny-eye left"></span>

            <span class="bunny-eye right"></span>

        </div>

    </div>


    <div class="bunny bunny-2">

        <div class="bunny-ear left"></div>

        <div class="bunny-ear right"></div>

        <div class="bunny-body">

            <span class="bunny-eye left"></span>

            <span class="bunny-eye right"></span>

        </div>

    </div>

</div>



<!-- =====================
     導覽列
===================== -->

<header>

    <div class="logo">
        桑多龍學習平台
    </div>


    <a
        href="beginner.html"
        class="back"
    >
        ← 返回課程
    </a>

</header>



<!-- =====================
     主要內容
===================== -->

<main class="container">


    <!-- 標題 -->

    <section class="title">

        <h1>
            韓文40音發音入門
        </h1>

        <p>
            從韓文的基本字母開始，<br>
            認識子音與母音，建立正確的韓文發音基礎。
        </p>

    </section>



    <!-- =====================
         40音介紹
    ===================== -->

    <section class="intro">

        <h2>

            <span class="number">
                01
            </span>

            認識韓文40音

        </h2>


        <p>

            學習韓文的第一步，
            就是先熟悉這些基本字母的形狀與發音。

            <br>

            韓文40音包含
            19個基本子音
            與
            21個基本母音。

            <br>

            這一階段我們先從
            <strong>19個基本子音</strong>
            開始。

        </p>

    </section>



    <!-- =====================
         19個基本子音
    ===================== -->

    <h2 class="section-title">

        19個基本子音

    </h2>


    <div
        class="alphabet-grid"
        id="consonants"
    >

    </div>


</main>



<!-- =====================
     Footer
===================== -->

<footer>

    © 2026 桑多龍學習平台

</footer>



<script>


/* ============================
   19個基本子音
============================ */


const consonants = [

    ["ㄱ", "기역", "g / k"],

    ["ㄴ", "니은", "n"],

    ["ㄷ", "디귿", "d / t"],

    ["ㄹ", "리을", "r / l"],

    ["ㅁ", "미음", "m"],

    ["ㅂ", "비읍", "b / p"],

    ["ㅅ", "시옷", "s"],

    ["ㅇ", "이응", "ng"],

    ["ㅈ", "지읒", "j"],

    ["ㅊ", "치읓", "ch"],

    ["ㅋ", "키읔", "k"],

    ["ㅌ", "티읕", "t"],

    ["ㅍ", "피읖", "p"],

    ["ㅎ", "히읗", "h"],

    ["ㄲ", "쌍기역", "kk"],

    ["ㄸ", "쌍디귿", "tt"],

    ["ㅃ", "쌍비읍", "pp"],

    ["ㅆ", "쌍시옷", "ss"],

    ["ㅉ", "쌍지읒", "jj"]

];



/* ============================
   建立子音卡片
============================ */


function createCards(data) {

    const container =
        document.getElementById("consonants");


    data.forEach(item => {


        const card =
            document.createElement("div");


        card.className =
            "alphabet-card";


        card.innerHTML = `

            <div class="letter">
                ${item[0]}
            </div>


            <div class="name">
                ${item[1]}
            </div>


            <div class="romanization">
                ${item[2]}
            </div>


            <button
                class="sound-button"
                onclick="playSound('${item[0]}')"
            >
                🔊 發音
            </button>

        `;


        container.appendChild(card);

    });

}



/* ============================
   播放韓文發音
   保留原本功能
============================ */


function playSound(letter) {


    const speech =
        new SpeechSynthesisUtterance(letter);


    speech.lang = "ko-KR";


    speech.rate = 0.7;


    speech.pitch = 1;


    speechSynthesis.cancel();


    speechSynthesis.speak(speech);

}



/* ============================
   啟動
============================ */


createCards(consonants);


</script>


</body>

</html>
