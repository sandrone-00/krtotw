<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>基本母音｜Chocochip Korean</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f7f5f2;
      color: #333;
      line-height: 1.6;
    }


    /* =========================
       Header
    ========================= */

    header {
      height: 70px;
      background: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 50px;

      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .back {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #000;
    }


    /* =========================
       Main
    ========================= */

    .container {
      max-width: 1000px;

      margin: 50px auto;

      padding: 0 20px;
    }


    /* =========================
       Title
    ========================= */

    .title {
      text-align: center;

      margin-bottom: 45px;
    }

    .title h1 {
      font-size: 36px;

      margin-bottom: 15px;
    }

    .title p {
      color: #777;

      line-height: 1.9;
    }


    /* =========================
       Intro
    ========================= */

    .intro {
      background: white;

      border-radius: 20px;

      padding: 35px;

      margin-bottom: 35px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.04);
    }

    .intro h2 {
      margin-bottom: 18px;

      font-size: 24px;
    }

    .intro p {
      color: #666;

      line-height: 2;
    }

    .number {
      display: inline-block;

      background: #333;

      color: white;

      padding: 3px 10px;

      border-radius: 20px;

      font-size: 12px;

      margin-right: 8px;
    }


    /* =========================
       Section Title
    ========================= */

    .section-title {
      font-size: 25px;

      margin: 45px 0 20px;
    }


    /* =========================
       Vowel Cards
    ========================= */

    .alphabet-grid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 15px;
    }

    .alphabet-card {
      background: white;

      border-radius: 15px;

      padding: 25px 15px;

      text-align: center;

      transition: 0.2s;

      border: 2px solid transparent;
    }

    .alphabet-card:hover {
      transform: translateY(-3px);

      border-color: #ddd;
    }

    .letter {
      font-size: 42px;

      margin-bottom: 10px;

      font-weight: bold;
    }

    .name {
      font-size: 14px;

      color: #666;

      margin-bottom: 12px;
    }

    .sound-button {
      border: none;

      background: #f1f1f1;

      border-radius: 20px;

      padding: 7px 15px;

      cursor: pointer;

      font-size: 14px;
    }

    .sound-button:hover {
      background: #e5e5e5;
    }


    /* =========================
       Advanced Pronunciation
    ========================= */

    .next-section {
      background: white;

      border-radius: 20px;

      padding: 40px;

      margin-top: 50px;

      margin-bottom: 60px;

      text-align: center;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.04);
    }

    .next-section h2 {
      font-size: 25px;

      margin-bottom: 15px;
    }

    .next-section p {
      color: #777;

      line-height: 1.9;

      margin-bottom: 25px;
    }


    /* =========================
       Password
    ========================= */

    .password-box {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .password-box input {
      width: 240px;

      padding: 12px 15px;

      border: 1px solid #ddd;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    .password-box input:focus {
      border-color: #999;
    }

    .password-box button {
      border: none;

      background: #333;

      color: white;

      padding: 12px 25px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;
    }

    .password-box button:hover {
      background: #555;
    }

    #passwordMessage {
      margin-top: 15px;

      font-size: 14px;

      min-height: 22px;
    }


    /* =========================
       Home Button
    ========================= */

    .home-button {
      display: inline-block;

      margin-top: 15px;

      color: #555;

      text-decoration: none;

      font-size: 14px;
    }

    .home-button:hover {
      color: #000;
    }


    /* =========================
       Footer
    ========================= */

    footer {
      background: white;

      text-align: center;

      padding: 30px;

      color: #999;

      font-size: 13px;
    }


    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 0 20px;
      }

      .title h1 {
        font-size: 30px;
      }

      .alphabet-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .password-box {
        flex-direction: column;
      }

      .password-box input {
        width: 100%;

        max-width: 300px;
      }

      .password-box button {
        width: 100%;

        max-width: 300px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       Header
  ========================= -->

  <header>

    <div class="logo">
      🇰🇷 Chocochip Korean
    </div>

    <a
      href="index.html"
      class="back"
    >
      ← 回首頁
    </a>

  </header>



  <!-- =========================
       Main
  ========================= -->

  <main class="container">


    <!-- Title -->

    <section class="title">

      <h1>
        基本母音
      </h1>

      <p>
        認識韓文的基本母音與複合母音，
        熟悉每個母音的形狀與發音。
      </p>

    </section>



    <!-- Introduction -->

    <section class="intro">

      <h2>

        <span class="number">
          01
        </span>

        認識韓文母音

      </h2>

      <p>

        韓文母音是組成韓文字的基礎。
        先熟悉母音的形狀與發音，
        再進一步和子音組合，
        就能開始閱讀韓文。

      </p>

    </section>



    <!-- Basic Vowels -->

    <h2 class="section-title">

      基本母音

    </h2>



    <div
      class="alphabet-grid"
      id="vowelGrid"
    ></div>



    <!-- =========================
         Advanced Pronunciation
    ========================= -->

    <section class="next-section">

      <h2>
        進階發音
      </h2>

      <p>

        完成基本母音學習後，
        接著學習韓文的進階發音。

        <br>

        內容包含複合母音、
        子音與母音組合，
        以及單字發音練習。

      </p>



      <div class="password-box">

        <input
          type="password"
          id="advancedPassword"
          placeholder="請輸入進階發音密碼"
          onkeydown="
            if(event.key === 'Enter')
            checkAdvancedPassword()
          "
        >

        <button
          onclick="checkAdvancedPassword()"
        >
          進入進階發音
        </button>

      </div>



      <div
        id="passwordMessage"
      ></div>



      <a
        href="index.html"
        class="home-button"
      >
        ← 回首頁
      </a>

    </section>


  </main>



  <!-- =========================
       Footer
  ========================= -->

  <footer>

    Chocochip Korean｜
    韓文發音學習平台

  </footer>



  <!-- =========================
       JavaScript
  ========================= -->

  <script>


    /* =========================
       Vowels
    ========================= */

    const vowels = [

      ["ㅏ", "아", "a"],
      ["ㅑ", "야", "ya"],
      ["ㅓ", "어", "eo"],
      ["ㅕ", "여", "yeo"],
      ["ㅗ", "오", "o"],
      ["ㅛ", "요", "yo"],
      ["ㅜ", "우", "u"],
      ["ㅠ", "유", "yu"],
      ["ㅡ", "으", "eu"],
      ["ㅣ", "이", "i"],

      ["ㅐ", "애", "ae"],
      ["ㅔ", "에", "e"],
      ["ㅒ", "얘", "yae"],
      ["ㅖ", "예", "ye"],

      ["ㅘ", "와", "wa"],
      ["ㅙ", "왜", "wae"],
      ["ㅚ", "외", "oe"],
      ["ㅝ", "워", "wo"],
      ["ㅞ", "웨", "we"],
      ["ㅟ", "위", "wi"],
      ["ㅢ", "의", "ui"]

    ];



    /* =========================
       Create Vowel Cards
    ========================= */

    const vowelGrid =
      document.getElementById(
        "vowelGrid"
      );


    vowels.forEach(function(vowel) {

      const card =
        document.createElement("div");


      card.className =
        "alphabet-card";


      card.innerHTML = `

        <div class="letter">
          ${vowel[0]}
        </div>

        <div class="name">
          ${vowel[1]} ｜ ${vowel[2]}
        </div>

        <button
          class="sound-button"
          onclick="playSound('${vowel[1]}')"
        >
          🔊 發音
        </button>

      `;


      vowelGrid.appendChild(card);

    });



    /* =========================
       Korean TTS
    ========================= */

    function playSound(text) {

      const speech =
        new SpeechSynthesisUtterance(
          text
        );


      speech.lang =
        "ko-KR";


      speech.rate =
        0.7;


      speech.pitch =
        1;


      speechSynthesis.cancel();


      speechSynthesis.speak(
        speech
      );

    }



    /* =========================
       Advanced Password
    ========================= */

    function checkAdvancedPassword() {

      const password =
        document
          .getElementById(
            "advancedPassword"
          )
          .value
          .trim();


      const message =
        document
          .getElementById(
            "passwordMessage"
          );


      if (
        password === "choco410"
      ) {

        message.textContent =
          "密碼正確，正在進入進階發音……";


        message.style.color =
          "green";


        setTimeout(
          function() {

            window.location.href =
              "advanced.html";

          },
          500
        );


      } else {

        message.textContent =
          "密碼錯誤，請重新輸入。";


        message.style.color =
          "red";

      }

    }


  </script>


</body>

</html>
