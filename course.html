<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>韓文40音發音入門｜Chocochip Korean</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
            background: #f7f5f2;
            color: #222;
        }

        header {
            padding: 25px 7%;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 12px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 50px;
            font-size: 17px;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .lesson-card {
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            transition: 0.2s;
        }

        .lesson-card:hover {
            transform: translateY(-3px);
        }

        .lesson-number {
            font-size: 15px;
            color: #888;
            margin-bottom: 10px;
        }

        .lesson-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .lesson-description {
            color: #666;
            line-height: 1.8;
            min-height: 60px;
        }

        .lesson-button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 20px;
            border-radius: 10px;
            border: none;
            background: #222;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .locked {
            background: #f1f1f1;
        }

        .locked .lesson-button {
            background: #aaa;
        }

        .lock-icon {
            font-size: 20px;
            margin-left: 5px;
        }

        #message {
            text-align: center;
            margin-top: 30px;
            color: #c66;
            min-height: 25px;
        }

        @media (max-width: 700px) {
            .lesson-grid {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🇰🇷 Chocochip Korean</div>

        <a class="back" href="index.html">
            ← 回到首頁
        </a>
    </header>


    <main class="container">

        <h1 class="title">韓文40音發音入門</h1>

        <p class="subtitle">
            從韓文40音開始，一步一步建立韓文發音基礎
        </p>


        <div class="lesson-grid">

            <!-- 基本子音 -->
            <div class="lesson-card">

                <div class="lesson-number">
                    STEP 01
                </div>

                <div class="lesson-title">
                    基本子音 🔓
                </div>

                <div class="lesson-description">
                    學習韓文19個基本子音，
                    認識每個字母的名稱、發音與基本發音方式。
                </div>

                <a class="lesson-button" href="alphabet.html">
                    開始學習 →
                </a>

            </div>


            <!-- 基本母音 -->
            <div class="lesson-card locked">

                <div class="lesson-number">
                    STEP 02
                </div>

                <div class="lesson-title">
                    基本母音 🔒
                </div>

                <div class="lesson-description">
                    學習韓文21個基本母音，
                    建立韓文母音發音的基礎。
                </div>

                <button class="lesson-button"
                    onclick="unlockLesson('choco40', 'vowels.html')">
                    輸入密碼 →
                </button>

            </div>


            <!-- 進階發音 -->
            <div class="lesson-card locked">

                <div class="lesson-number">
                    STEP 03
                </div>

                <div class="lesson-title">
                    進階發音 🔒
                </div>

                <div class="lesson-description">
                    進一步認識韓文進階發音，
                    練習不同發音的發音方式。
                </div>

                <button class="lesson-button"
                    onclick="unlockLesson('choco410', 'advanced.html')">
                    輸入密碼 →
                </button>

            </div>


            <!-- 收音 -->
            <div class="lesson-card locked">

                <div class="lesson-number">
                    STEP 04
                </div>

                <div class="lesson-title">
                    收音 🔒
                </div>

                <div class="lesson-description">
                    認識韓文收音的基本規則，
                    開始練習韓文單字與完整發音。
                </div>

                <button class="lesson-button"
                    onclick="unlockLesson('choco530', 'batchim.html')">
                    輸入密碼 →
                </button>

            </div>

        </div>


        <div id="message"></div>

    </main>


    <script>

        function unlockLesson(correctPassword, page) {

            const password = prompt("請輸入老師提供的課程密碼：");

            if (password === correctPassword) {

                window.location.href = page;

            } else if (password !== null) {

                document.getElementById("message").textContent =
                    "密碼錯誤，請向老師確認密碼。";

            }

        }

    </script>

</body>
</html>
